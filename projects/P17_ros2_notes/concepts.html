<h1>ROS 2 最小概念（原创导读）</h1>
<ul><li>Node：进程内逻辑单元。</li><li>Topic：异步发布/订阅；QoS 决定可靠性与历史。</li><li>Service：请求/响应。</li><li>Action：长任务+反馈。</li><li>tf2：坐标系树；与领域 08 的坐标约定必须一致（NED/ENU）。</li><li>Launch：启动图，不是算法。</li></ul>
